services:
    app:
      build: .
      ports:
        - "8000:8000"
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
      depends_on:
        - redis
        - postgres
      networks:
        - app-network

    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - app-network

    redis:
      image: redis:7-alpine
      networks:
        - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
